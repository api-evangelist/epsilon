      - {path: /.well-known/agent.json, status: 404, document: false}

  - host: eu-ads.rmn.dotomi.com
    note: Live regional Epsilon Retail Media ad-serving host (verified serving /v1/ads/* and /ads/v3/brand-pages).
    probes:
      - {path: /.well-known/api-catalog, status: 404, document: false}
      - {path: /.well-known/security.txt, status: 404, document: false}
      - {path: /.well-known/agent-card.json, status: 404, document: false}

  - host: citrusad.com
    note: >-
      SPA catch-all. Answers 200 text/html (~53KB, identical body) for every
      .well-known path probed, including ones that cannot exist. NOT a document
      hit — recorded as a miss.
    catch_all_200: true
    probes:
      - {path: /.well-known/security.txt, status: 200, content_type: text/html, document: false}
      - {path: /.well-known/openid-configuration, status: 200, content_type: text/html, document: false}
