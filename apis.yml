# Pointers deliberately NOT emitted, and why. Each of these has an artifact on
# disk recording an absence; wiring the canonical type would assert the provider
# publishes a surface it does not.
#   ChangeLog     — changelog/epsilon-changelog.yml records published: false
#                   (/integration/changelog 404s). No changelog exists.
#   StatusPage    — lifecycle/ records that every status.* host fails to resolve;
#                   epsilon.statuspage.io is an unfinished template whose
#                   components are named "API (example)".
#   Deprecation   — no deprecation, sunset or EOL policy anywhere in the 121-page
#                   developer hub index.
#   SDKs          — packages/ records package_count: 0 verified across npm, PyPI,
#                   Packagist, RubyGems, NuGet and GitHub.
#   Security /
#   SecurityTxt   — no RFC 9116 policy, no VDP, no bug bounty on any host.
#   Compliance /
#   TrustCenter   — no published certifications; trust.epsilon.com does not resolve.
#   Idempotency   — conventions/ records supported: false. No Idempotency-Key
#                   mechanism exists on any Epsilon Retail Media surface.
#   MCPServer     — mcp/ is status: candidate, derived from OpenAPI. Epsilon runs
#                   no MCP server.
#   AgentCard     — /.well-known/agent-card.json and /.well-known/agent.json miss
#                   on every host. Nothing written; search-only by contract.
#   AsyncAPI /
#   Webhooks      — no event, streaming or webhook surface exists to describe.
#   Pricing       — citrusad.com/pricing is a demo-request form with no prices;
#                   plans/ records plan_count: 0.
