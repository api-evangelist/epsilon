aid: epsilon
name: Epsilon
description: >-
  Epsilon is a Publicis Groupe marketing and advertising technology company that
  operates identity-led, data-driven marketing across paid, owned and earned
  channels. Its public, machine-readable API surface sits almost entirely inside
  Epsilon Retail Media (the platform built on CitrusAd, which Publicis acquired in
  2021 and folded into Epsilon), whose developer hub at developers.citrusad.com
  publishes an Integration API for syncing catalogs, products, customers and
  orders and for generating product, banner and Banner X ads; a Filter Mapping
  API; a Cross-Sell Category API; and a Brand Pages API served from regional
  *.rmn.dotomi.com hosts. Epsilon also runs Epsilon PeopleCloud (loyalty, CRM,
  digital media) and CORE Private Exchange for publishers, but neither publishes a
  public machine-readable contract. API access is provisioned by a Technical
  Account Manager rather than self-service signup.
