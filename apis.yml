apis:
- aid: epsilon:epsilon-retail-media-brand-pages-api
  name: Epsilon Retail Media Brand Pages API
  description: >-
    Serves brand-page content modules for retailer-hosted brand landing pages. A retailer routes /brands/{slug}
    on its own domain, calls POST /ads/v3/brand-pages on its assigned regional Epsilon RMN ads host with
    the urlSlug and catalogId, and renders the returned modules, theme and tracking templates with its
    own UI components. Impression, click and add-to-cart tracking is fired either client-to-server through
    a retailer reverse proxy or server-to-server directly to the regional tracking host. Uses the same
    API key as the rest of the Epsilon RMN platform. No OpenAPI is published for this surface; the request
    and response contracts are documented in prose.
  humanURL: https://developers.citrusad.com/integration/reference/brand-page-apis
  baseURL: https://eu-ads.rmn.dotomi.com
