description: >-
  Epsilon Retail Media declares HTTP 429 on all 13 Integration API operations and
  documents nothing else. There is no published limit, no window, no scope, no
  burst allowance, and no response header — not RateLimit-*, not X-RateLimit-*,
  not Retry-After. The declared 429 response in the OpenAPI carries no
  description, no schema and an empty example. A client that gets throttled is
  told only that it was throttled, with no signal for how long to back off, which
  matters more than usual here because ad generation sits synchronously in the
  shopper's page render.

