related_guidance:
  - name: Persistent HTTP connection required
    note: >-
      Not a rate limit, but the nearest thing the docs publish to a throughput
      contract: retailers are required to hold a persistent HTTP connection for ad
      generation because per-request TLS handshakes degrade response times.
    url: https://developers.citrusad.com/integration/reference/http-persistence-ad-caching-endpoints-1
  - name: Timeouts and graceful fallback
    note: >-
      Retailers are told to render the page without sponsored placements when an
      ad request times out or errors, which is the documented mitigation for both
      throttling and outage.
    url: https://developers.citrusad.com/integration/reference/timeouts-and-graceful-fallback-behaviour

gaps:
  - No published limit of any kind, for any scope or window.
  - No rate-limit response headers, so a client cannot see remaining quota or reset time.
  - No Retry-After on 429, so backoff is guesswork.
  - The 429 response is declared with no description or schema, so generated clients get an untyped throttle path.
