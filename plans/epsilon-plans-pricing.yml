description: >-
  Epsilon publishes no plans, tiers or rates for any of its products. The
  /pricing URL on citrusad.com resolves to a lead-capture form asking for name,
  company, email, website and country to "arrange a quick demo" — there is not a
  single number on it. Epsilon Retail Media is sold through a managed commercial
  relationship: campaigns are funded from a per-team wallet (the reporting data
  warehouse exposes wallet balance and ledger transaction views), but neither the
  wallet mechanics, the ad rate card, nor any API access fee is published. API
  credentials themselves are issued by a Technical Account Manager, so there is
  no self-service tier to price.

